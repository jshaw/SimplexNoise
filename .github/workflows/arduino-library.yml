name: Arduino Library

on:
  # Restricted to master so that a pull request does not run the whole matrix
  # twice (once for push, once for pull_request).
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          compliance: strict

  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:uno
          - esp32:esp32:esp32
          - teensy:avr:teensy41
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure package indexes
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
      - name: Install cores
        # These pull large toolchains from third-party release hosts, which
        # time out intermittently (the ESP32 xtensa toolchain especially).
        # Retry before failing so transient network errors don't red-flag a PR.
        run: |
          arduino-cli core update-index
          for core in arduino:avr esp32:esp32 teensy:avr; do
            for attempt in 1 2 3; do
              if arduino-cli core install "$core"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to install core $core after 3 attempts"
                exit 1
              fi
              echo "Install of $core failed (attempt $attempt/3), retrying in 15s..."
              sleep 15
            done
          done
      - name: Install servo libraries for the optional SimplexServo helper
        # The core noise API has no dependencies; these are only needed to
        # build the servo examples. PWMServo is deliberately not installed:
        # the Teensy core bundles it, and a Library Manager copy would shadow
        # the bundled one rather than testing what Teensy users actually get.
        run: |
          arduino-cli lib install Servo
          arduino-cli lib install ESP32Servo
      - name: Compile examples
        run: |
          for sketch in examples/*/*.ino; do
            arduino-cli compile --library . --fqbn "${{ matrix.fqbn }}" "$sketch"
          done
